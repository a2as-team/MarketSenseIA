agents:
  analista:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: agente_analista
      instruction: ['Com base nos dados fornecidos, realize uma análise aprofundada e apresente suas descobertas nas seguintes
          seções, utilizando uma linguagem visualmente atraente com emojis estratégicos:', '- **Análise de Tendências e Sentimento**
          📈:', '- **Temas em Alta**: Identifique os 3-5 subtemas mais quentes e com maior engajamento.', '- **Sentimento Geral**:
          Classifique o sentimento predominante (positivo, negativo, neutro) e justifique com exemplos de menções ou contextos.',
        '- **Principais Influenciadores**: Liste os principais criadores de conteúdo, marcas ou veículos que estão liderando
          a conversa.', '- **Perfil do Público-Alvo** 🎯:', '- **Demografia**: Descreva a faixa etária, gênero e localização
          do público mais engajado.', '- **Interesses e Comportamentos**: Detalhe os interesses, hobbies e comportamentos
          de consumo do público.', '- **Dores e Necessidades**: Identifique os principais problemas, desafios e necessidades
          que o público expressa.', '- **Análise Competitiva** ⚔️:', '- **Principais Concorrentes**: Identifique 2-3 concorrentes
          diretos ou indiretos que atuam no mesmo nicho.', '- **Estratégias de Sucesso**: Analise o que está funcionando para
          eles (tipos de conteúdo, campanhas, etc.).', '- **Lacunas e Oportunidades**: Aponte as áreas que os concorrentes
          não estão explorando e que representam uma oportunidade.', '- **Recomendações Estratégicas e de Conteúdo** 💡:',
        '- **Pilares de Conteúdo**: Sugira 3-4 pilares de conteúdo para abordar as dores e interesses do público.', '- **Formatos
          de Conteúdo**: Recomende os formatos mais eficazes (vídeos curtos, blog posts, infográficos, etc.) com base no perfil
          do público.', '- **Exemplos de Títulos**: Forneça 3 exemplos de títulos de conteúdo que poderiam ser criados para
          cada pilar.', 'Se os dados forem insuficientes, informe ao usuário de forma clara e sugira maneiras de refinar a
          pesquisa para obter melhores resultados. O objetivo é entregar um relatório que sirva como um verdadeiro guia estratégico.']
      description: Agente de análise de tendências
      function: criar_agente_analista
  rastreador:
    type: instance
    models: [gemini-2.0-flash]
    tools: [google_search]
    params:
      name: agente_rastreador
      instruction: ['- Apresente uma lista objetiva com os principais temas, hashtags e manchetes mais relevantes e recentes.',
        '- Caso não haja informações suficientes, sugira ao usuário refinar o tópico com algo mais específico ou atual.',
        '- Seja claro, direto e conciso, evitando formatações desnecessárias como markdowns do Telegram.']
      description: Agente rastreador de tendências
      function: criar_agente_rastreador
  relator:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: agente_relatorio
      instruction: ['Com base no briefing fornecido, estruture sua resposta em três seções claras e diretas:', '1. **Plano
          de Marketing Estratégico** 🚀:', '- **Objetivos da Campanha**: Defina 2-3 objetivos SMART (Específicos, Mensuráveis,
          Atingíveis, Relevantes, Temporais).', '- **Mensagem Chave**: Elabore uma mensagem central que ressoe com as "dores"
          e interesses do público-alvo.', '- **Canais de Marketing**: Recomende os canais mais eficazes (ex: Instagram, TikTok,
          Blog, E-mail Marketing) e justifique a escolha.', '- **KPIs (Indicadores-Chave de Desempenho)**: Liste os principais
          KPIs para medir o sucesso da campanha (ex: taxa de engajamento, crescimento de seguidores, tráfego do site, taxa
          de conversão).', '2. **Prompt de Imagem para Infográfico** 🎨:', '- **Conceito Visual**: Descreva o conceito geral
          do infográfico (ex: "jornada do consumidor", "ecossistema de conteúdo", "pilares da estratégia").', '- **Estrutura
          e Layout**: Detalhe a organização visual, incluindo a disposição dos elementos, hierarquia de informações e fluxo
          de leitura.', '- **Elementos Gráficos**: Especifique os tipos de gráficos (barras, pizza, linha do tempo), ícones,
          ilustrações e a paleta de cores.', '- **Texto e Dados**: Indique os principais dados e textos que devem ser incluídos
          no infográfico.', '**Exemplo de Prompt de Imagem**:', '3. **Recomendação de Próximos Passos** 👣:', '- **Ações Imediatas**:
          Sugira as 2-3 primeiras ações que devem ser tomadas para colocar o plano em prática.', '- **Ferramentas Úteis**:
          Recomende ferramentas (ex: Canva, Google Analytics, Hootsuite) que possam auxiliar na execução e monitoramento da
          campanha.', O objetivo é fornecer um guia prático e inspirador que capacite o usuário a agir com base nos insights
          coletados.]
      description: Gerador de relatório multimodal
      function: criar_agente_relatorio

models:
  gemini-2.0-flash:
    type: literal
    agents: [rastreador, analista, relator]

tools:
  google_search:
    type: module
    agents: [rastreador]

imports:
  Agent: google.adk.agents.Agent
  ApplicationBuilder: telegram.ext.ApplicationBuilder
  asyncio: asyncio
  base64: base64
  BytesIO: io.BytesIO
  ChatAction: telegram.constants.ChatAction
  CommandHandler: telegram.ext.CommandHandler
  ContextTypes: telegram.ext.ContextTypes
  ConversationHandler: telegram.ext.ConversationHandler
  date: datetime.date
  filters: telegram.ext.filters
  genai: google.genai
  genai_img: google.genai
  GOOGLE_API_KEY: config.GOOGLE_API_KEY
  google_search: google.adk.tools.google_search
  Image: PIL.Image
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  io: io
  json: json
  load_dotenv: dotenv.load_dotenv
  logging: logging
  MessageHandler: telegram.ext.MessageHandler
  os: os
  re: re
  Runner: google.adk.runners.Runner
  TELEGRAM_TOKEN: config.TELEGRAM_TOKEN
  tempfile: tempfile
  textwrap: textwrap
  types: google.genai.types
  Update: telegram.Update
  warnings: warnings

functions:
  broadcast:
    type: async
    module: marketAgent
    args: [update, context]
  call_agent:
    type: async
    module: marketAgent
    args: [agent, message_text, chat_id, verbose]
    params:
      returns: str
  cancelar:
    type: async
    module: marketAgent
    args: [update, context]
    params:
      returns: int
  criar_agente_analista:
    type: sync
    module: marketAgent
    args: [topico, dados]
  criar_agente_rastreador:
    type: sync
    module: marketAgent
    args: [topico, data]
  criar_agente_relatorio:
    type: sync
    module: marketAgent
    args: [topico, briefing]
  extrair_prompt_imagem:
    type: sync
    module: marketAgent
    args: [relatorio_texto]
  gerar_e_enviar_imagem:
    type: async
    module: marketAgent
    args: [update, context, prompt]
  get_session:
    type: async
    module: marketAgent
    args: [chat_id, agent_name]
  main:
    type: sync
    module: marketAgent
  processar_topico:
    type: async
    module: marketAgent
    args: [update, context]
  promo_start:
    type: async
    module: marketAgent
    args: [update, context]
    params:
      returns: int
  receber_email:
    type: async
    module: marketAgent
    args: [update, context]
    params:
      returns: int
  registrar_usuario:
    type: sync
    module: marketAgent
    args: [chat_id]
  start:
    type: async
    module: marketAgent
    args: [update, context]

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [config]
  PORT:
    type: env
    params:
      caller: [os.environ.get]
      path: [marketAgent]
  RENDER_EXTERNAL_URL:
    type: env
    params:
      caller: [os.environ.get]
      path: [marketAgent]
  TELEGRAM_TOKEN:
    type: env
    params:
      caller: [os.getenv]
      path: [config]

files:
  .png:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      delete: "False"
  tmp_file:
    type: variable
    actions: [read]
    params:
      caller: [image.save]
  tmp_file_path:
    type: variable
    actions: [read, delete]
    params:
      caller: [open, os.remove]
  user_data.json:
    type: literal
    actions: [read, write]
    params:
      caller: [open, json.load]
      alias: [f]
      variable: USER_DATA_FILE

networks:
  WEBHOOK_URL:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{os.environ.get}/
      caller: [main]
      dynamic: "True"
      variable: WEBHOOK_URL
